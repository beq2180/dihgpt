name: Prepare Paper 1.21.11 Server

on:
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Download latest stable Paper 1.21.11
        shell: bash
        run: |
          mkdir -p server
          cd server

          USER_AGENT="paper-server-preparer/1.0 (https://github.com/${GITHUB_REPOSITORY})"

          BUILDS=$(curl -fsSL \
            -H "User-Agent: $USER_AGENT" \
            "https://fill.papermc.io/v3/projects/paper/versions/1.21.11/builds")

          PAPER_URL=$(echo "$BUILDS" | jq -r \
            'first(.[] | select(.channel == "STABLE") | .downloads."server:default".url) // "null"')

          if [ "$PAPER_URL" = "null" ]; then
            echo "Could not find a stable Paper 1.21.11 build."
            exit 1
          fi

          echo "Downloading Paper..."
          curl -fL \
            -H "User-Agent: $USER_AGENT" \
            "$PAPER_URL" \
            -o paper.jar

          ls -lh paper.jar

      - name: Accept EULA for preparation
        run: |
          echo "eula=true" > server/eula.txt

      - name: Run Paper once and download everything
        shell: bash
        run: |
          cd server

          mkfifo server-input

          java \
            -Xms512M \
            -Xmx1G \
            -jar paper.jar \
            --nogui \
            < server-input \
            > first-run.log 2>&1 &

          SERVER_PID=$!

          exec 3>server-input

          echo "Waiting for Paper to finish starting..."

          STARTED=false

          for i in {1..180}; do
            if grep -q "Done (" first-run.log 2>/dev/null; then
              STARTED=true
              break
            fi

            if ! kill -0 "$SERVER_PID" 2>/dev/null; then
              echo "Paper exited unexpectedly:"
              cat first-run.log
              exit 1
            fi

            sleep 1
          done

          if [ "$STARTED" != "true" ]; then
            echo "Server did not finish starting."
            cat first-run.log
            kill "$SERVER_PID" || true
            exit 1
          fi

          echo "Paper successfully started!"
          echo "stop" >&3

          wait "$SERVER_PID"

          exec 3>&-
          rm -f server-input

          cat first-run.log

      - name: Remove temporary generated world
        run: |
          cd server

          rm -rf world
          rm -rf world_nether
          rm -rf world_the_end

          rm -rf logs
          rm -f first-run.log

      - name: Make Mac startup script
        shell: bash
        run: |
          cat > server/start.command <<'EOF'
          #!/bin/zsh

          cd "$(dirname "$0")"

          echo "Starting Paper 1.21.11..."
          echo

          java \
            -Dpaper.disableStartupVersionCheck \
            -Xms512M \
            -Xmx3G \
            -jar paper.jar \
            --nogui
          EOF

          chmod +x server/start.command

      - name: Upload prepared server
        uses: actions/upload-artifact@v4
        with:
          name: Paper-1.21.11-Prepared
          path: server/
          compression-level: 6
